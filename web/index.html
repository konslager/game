  for (const rp of r.reputation || []) p.rep += rp.amount;
  for (const it of r.items || []) {
    if (it.type === 'equipment') emit(`Reward: ${it.name} — ${receive(p, toItem(it))}`, 'loot t' + TIER_IX[it.tier]);
    else p.cons[it.id] = (p.cons[it.id] || 0) + it.qty;
  }
  for (const u of r.unlocks || []) if (!p.unlocks.includes(u)) p.unlocks.push(u);
  const opt = q.objectives.some((o, i) => o.optional && objDone(q, st, i));
  if (opt && r.bonusIfOptionalDone) p.gold += r.bonusIfOptionalDone.gold;
  emit(`Quest complete: ${q.name} — +${r.exp} exp, +${r.gold + (opt && r.bonusIfOptionalDone ? r.bonusIfOptionalDone.gold : 0)} gold`, 'quest');
}

// ===== Offline progress (sample 300 ticks, extrapolate at 60%, cap 12h) =====
const totalExp = p => { let s = p.exp; for (let l = 1; l < p.level; l++) s += expToNext(l); return s; };
function offline(seconds) {
  const sec = Math.min(Math.floor(seconds), 12 * 3600);
  if (sec <= 0) return null;
  const p = G.p, e0 = totalExp(p), g0 = p.gold, l0 = p.level, sample = Math.min(sec, 300);
  const ab = G.autoBoss, act0 = G.activity; G.autoBoss = false; G.loot = false; G.activity = 'fight'; G.queue = [];
  for (let i = 0; i < sample; i++) tick();
  G.autoBoss = ab; G.loot = true; G.activity = act0;
  const rest = sec - sample;
  if (rest > 0) {
    const k = rest / sample * .6;
    gainExp(p, Math.trunc((totalExp(p) - e0) * k)); p.gold += Math.trunc((p.gold - g0) * k);
  }
  restore(p);
  return { sec, exp: totalExp(p) - e0, gold: p.gold - g0, lv: p.level - l0 };
}

const KEY = 'riftbound.save.v1';

  autoAdv: G.autoAdv, autoPot: G.autoPot, speed: G.speed, activity: G.activity, district: G.district, ticks: G.ticks,
});
function save() { try { localStorage.setItem(KEY, JSON.stringify(snapshot())); } catch (e) { /* storage unavailable */ } }
function fromSnap(d) {
  const g = newGame();
  for (const k of ['zone', 'kills', 'autoBoss', 'autoUp', 'autoAdv', 'autoPot', 'speed', 'activity', 'district', 'ticks']) if (d[k] !== undefined) g[k] = d[k];

}

function effectText(d) {
  const e = d.effect;
  return { heal_pct: `Restores ${e.value * 100}% HP`, mana_flat: `Restores ${e.value} MP`, defense_pct: `+${e.value * 100}% DEF for ${e.durationSeconds / 60} min`,
    luck_flat: `+${e.value} LUK for ${e.durationSeconds / 60} min`, promote_gold_cost_pct: `Next promote costs ${-e.value * 100}% less gold`,
    roll_item: `Random item from zone ${e.zoneId}, ${e.minTier} or better` }[e.kind] + (d.cooldownSeconds ? ` · ${d.cooldownSeconds}s cooldown` : '');
}
function itemLine(it) {
  if (it.type === 'equipment') {
    const b = it.baseBonus, parts = [['STR', b.strength], ['AGI', b.agility], ['INT', b.intelligence], ['VIT', b.vitality], ['LUK', b.luck], ['DEF', it.baseDefense]].filter(x => x[1]).map(x => `${x[0]} ${x[1]}`);

}

function questsHtml(p) {
  const all = Object.values(QST);
  const list = all.filter(q => qState(q.id) && qState(q.id).state === 'active')
    .concat(all.filter(q => qAvailable(q)))
    .concat(all.filter(q => !qState(q.id) && !qAvailable(q)))
    .concat(all.filter(q => qState(q.id) && qState(q.id).state === 'done'));
  return list.map(q => {
    const st = qState(q.id), r = q.rewards, g = NPC[q.giverNpcId];
    const rew = [`${fmt(r.exp)} exp`, `${fmt(r.gold)} g`, ...(r.reputation || []).map(x => `${x.amount} rep`), ...(r.items || []).map(i => `${i.qty > 1 ? i.qty + '× ' : ''}${i.name || matName(i.id)}`)].join(' · ');
    let body = `<div class="meta">${q.type} · Lv ${q.minLevel}+ · from ${esc(g.name)} (${esc(DIST[g.districtId].name)})</div>`;
    let actBtn = '';
    if (st && st.state === 'active') {
      body += `<div class="obj">${q.objectives.map((o, i) => {
        const done = objDone(q, st, i);
        let label, extra = '';
        if (o.kind === 'kill') label = `Kill ${MON[o.monsterId].name} ${Math.min(st.prog[i], o.count)}/${o.count}`;
        else if (o.kind === 'collect') label = `Bring ${matName(o.itemId)} ${Math.min(p.mats[o.itemId] || 0, o.count)}/${o.count}`;
        else if (o.kind === 'talk') { label = `Meet ${NPC[o.npcId].name} in ${DIST[NPC[o.npcId].districtId].name}`; if (!done) extra = btn('Go', `data-act="qact" data-q="${q.id}" data-i="${i}"`); }
        else { label = `Deliver to ${NPC[o.toNpcId].name} in ${DIST[NPC[o.toNpcId].districtId].name}`; if (!done) extra = btn('Deliver', `data-act="qact" data-q="${q.id}" data-i="${i}"`, !!p.qitems[o.itemId]); }
        return `<div class="${done ? 'ok' : ''}">${done ? '✓' : '○'} ${esc(label)}${o.optional ? ' (optional)' : ''} ${extra}</div>`;
      }).join('')}</div>`;
      if (q.timeLimitSeconds) {
        const left = q.timeLimitSeconds - (G.ticks - st.t);
        body += `<div class="meta">Time left: <span class="num">${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</span> (game time)</div><div class="cd q"><i style="width:${left / q.timeLimitSeconds * 100}%"></i></div>`;
      }
      actBtn = btn('Turn in', `data-act="turnin" data-q="${q.id}"`, qComplete(q, st), 'sm go');
    } else if (qAvailable(q)) {
      body += `<p class="lead" style="margin-top:4px">${esc(q.description)}</p>`;
      if (st && st.state === 'failed') body += `<div class="meta miss">Failed earlier — you can try again.</div>`;
      actBtn = btn('Accept', `data-act="accept" data-q="${q.id}"`, true, 'sm go');
    } else if (st && st.state === 'done') {
      actBtn = '<span class="meta">Done</span>';
    } else {
      const need = [p.level < q.minLevel ? `Lv ${q.minLevel}` : '', ...q.prerequisiteQuestIds.filter(x => !(qState(x) && qState(x).state === 'done')).map(x => `“${QST[x].name}”`)].filter(Boolean).join(', ');
      body += `<div class="meta miss">Requires ${esc(need)}</div>`;
      actBtn = '<span class="meta">Locked</span>';
    }
    body += `<div class="meta">Reward: ${esc(rew)}${r.bonusIfOptionalDone ? ` · +${r.bonusIfOptionalDone.gold} g bonus` : ''}</div>`;
    return `<div class="row ${st && st.state === 'done' ? '' : 't4'}"><div><div class="name">${esc(q.name)}</div>${body}</div><div class="acts">${actBtn}</div></div>`;
  }).join('');
}

    else if (e.type === 'heal') { floatText(hx, gy - 70, '+' + e.amt, '#8fe07a'); burst(hx, gy - 30, '#8fe07a', 10, 40); }
    else if (e.type === 'shield') { S.shieldT = 1.2; }
    else if (e.type === 'kill') { S.dying = e.mon; S.dieT = 1; burst(mx, gy - 25, e.mon.boss ? '#ffd040' : '#c8c0b8', e.mon.boss ? 40 : 12, e.mon.boss ? 110 : 60); if (e.mon.boss) { S.flash = .8; S.flashC = '#ffd040'; } }
    else if (e.type === 'loot') { const col = getComputedStyle(document.documentElement).getPropertyValue('--t' + e.tier).trim(); burst(mx, gy - 20, col, 10 + e.tier * 6, 50 + e.tier * 15); floatText(mx, gy - 84, TIERS[e.tier] + '!', col, e.tier >= 3); }
    else if (e.type === 'level') { S.ring = 1; floatText(hx, gy - 92, 'LEVEL UP', '#8fe07a', true); burst(hx, gy - 30, '#8fe07a', 24, 90); }
    else if (e.type === 'gather') { S.heroLunge = 1; floatText(mx, gy - 46, '+1 ' + e.name, '#ffd8a0'); burst(mx, gy - 16, '#ffb060', 6, 40); }
  }
  // sky
  const g = ctx.createLinearGradient(0, 0, 0, gy); g.addColorStop(0, art.sky[0]); g.addColorStop(1, art.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  if (zi === 1 || zi === 5) { // rift glow / moon
    const rg = ctx.createRadialGradient(w * .62, h * .18, 2, w * .62, h * .18, 60); rg.addColorStop(0, zi === 1 ? 'rgba(220,170,255,.55)' : 'rgba(230,230,255,.6)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, w, h);
  }
  // far ridge (parallax)
  const off = RM ? 0 : (S.t * 4) % 200;
  ctx.fillStyle = art.far; ctx.beginPath(); ctx.moveTo(0, gy);
  for (const [x, y] of ridge(zi * 7 + 1, w + 200, gy - 10, 40)) ctx.lineTo(x - off, y);
  ctx.lineTo(w, gy); ctx.closePath(); ctx.fill();
  ctx.fillStyle = art.ground; ctx.fillRect(0, gy - 2, w, h - gy + 2);
  ctx.fillStyle = 'rgba(255,255,255,.04)'; ctx.fillRect(0, gy - 2, w, 2);
  // ambient particles
  if (!RM) {
    while (S.parts.filter(p => !p.burst).length < 26) S.parts.push(spawnPart(art));
  }
  for (const p of S.parts) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.burst) { p.vy += 120 * dt; p.life -= dt; p.a = Math.max(0, p.life); }
    else if (p.x < -5 || p.x > w + 5 || p.y < -5 || p.y > h + 5) p.life = 0;
    const a = art.p === 'star' && !p.burst ? p.a * (0.5 + 0.5 * Math.sin(S.t * 2 + p.tw)) : p.a;
    ctx.globalAlpha = a; ctx.fillStyle = p.c || art.pc;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  S.parts = S.parts.filter(p => p.life > 0);
  // actors
  const gathering = G.activity !== 'fight' && !G.queue.length && G.mode !== 'boss';
  const ease = v => v * v;
  const hl = ease(S.heroLunge) * 22, hs = S.heroShake * (Math.random() - .5) * 6;
  if (S.ring > 0) { ctx.strokeStyle = `rgba(143,224,122,${S.ring})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(hx, gy, 30 * (2 - S.ring), 8 * (2 - S.ring), 0, 0, 7); ctx.stroke(); }
  drawHero(ctx, hx + hl + hs, gy, cls(G.p), S.t, { swing: S.heroLunge });
  if (G.p.shield > 0 || S.shieldT > 0) {
    ctx.strokeStyle = 'rgba(180,200,255,.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(hx + hl, gy - 28, 32, -1.2, 1.2); ctx.stroke();
  }
  if (gathering) drawNode(ctx, G.activity, mx, gy, S.t, G.gather / NODES[G.activity].seconds);
  else {
    if (G.mon && G.mon.hp > 0) {
      const ms = S.monShake * (Math.random() - .5) * 8, ml = -ease(S.monLunge) * 18;
      drawMonster(ctx, G.mon, mx + ms + ml, gy, S.t, zi);
    }
    if (S.dying && S.dieT > 0) {
      ctx.globalAlpha = S.dieT; drawMonster(ctx, S.dying, mx, gy + (1 - S.dieT) * 10, S.t, zi); ctx.globalAlpha = 1;
    }
  }
  // floats
  for (const f of S.floats) {
    f.t += dt; const a = Math.max(0, 1 - f.t / 1.1);
    ctx.globalAlpha = a; ctx.font = `700 ${f.big ? 18 : 13}px "JetBrains Mono", ui-monospace, monospace`; ctx.textAlign = 'center';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,10,20,.8)'; const fy = f.y - f.t * 26;
    ctx.strokeText(f.text, f.x, fy); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, fy);
  }
  ctx.globalAlpha = 1;
  S.floats = S.floats.filter(f => f.t < 1.1);
  if (S.flash > 0) { ctx.globalAlpha = S.flash * .35; ctx.fillStyle = S.flashC; ctx.fillRect(0, 0, w, h); ctx.globalAlpha = 1; }
  // zone label
  ctx.font = '700 11px "Alegreya Sans", system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fillText(`${G.zone}. ${Z().name.toUpperCase()}`, 10, 16);
  // decay
  const d = dt * 5;
  S.heroLunge = Math.max(0, S.heroLunge - d); S.monLunge = Math.max(0, S.monLunge - d); S.heroShake = Math.max(0, S.heroShake - d);
  S.monShake = Math.max(0, S.monShake - d); S.flash = Math.max(0, S.flash - dt * 2); S.dieT = Math.max(0, S.dieT - dt * 2.2);
  S.ring = Math.max(0, S.ring - dt * 1.2); S.shieldT = Math.max(0, S.shieldT - dt);
}

// ===== Start screen =====
let startOpen = false, pickClass = 'gladiator';
function classCards() {
  const max = 60;
  $('classList').innerHTML = Object.values(CLASSES).map(c => `
    <button class="ccard" data-class="${c.id}" aria-pressed="${c.id === pickClass}" style="--cc:${c.color}">
      <canvas width="184" height="220" data-portrait="${c.id}"></canvas>
      <span>
        <h3>${c.name}</h3><span class="role">${c.role}</span>
        <span class="mini">${[['STR', c.base.s], ['AGI', c.base.a], ['INT', c.base.i], ['VIT', c.base.v], ['LUK', c.base.l]].map(([k, v]) => `<div>${k} ${v}<i style="width:${Math.min(100, v / max * 100)}%"></i></div>`).join('')}</span>
        <span class="passive">${c.buffs.map(b => `<span class="buff">▲ ${b}</span>`).join('')}${c.debuffs.map(b => `<span class="debuff">▼ ${b}</span>`).join('')}</span>
        <span class="skills" style="display:block">Skills: ${c.skills.map(x => x.name).join(', ')}</span>
      </span>
    </button>`).join('');
  document.querySelectorAll('[data-portrait]').forEach(cv => {
    const ctx = cv.getContext('2d'); ctx.setTransform(2, 0, 0, 2, 0, 0);
    const c = CLASSES[cv.dataset.portrait];
    const g = ctx.createRadialGradient(46, 60, 4, 46, 60, 60); g.addColorStop(0, c.color + '55'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 92, 110);
    drawHero(ctx, 44, 98, c, 0, { scale: 1.25, swing: .3 });
  });
}
function openStart() { startOpen = true; $('start').hidden = false; classCards(); $('heroName').value = (G && G.p.name) || 'Hero'; }
$('classList').addEventListener('click', e => {
  const b = e.target.closest('[data-class]'); if (!b) return;
  pickClass = b.dataset.class;
  document.querySelectorAll('.ccard').forEach(x => x.setAttribute('aria-pressed', x.dataset.class === pickClass));
});
$('btnBegin').onclick = () => {
  const name = ($('heroName').value || 'Hero').trim().slice(0, 16) || 'Hero';
  G = newGame(pickClass, name);
  G.p.cons.minor_healing_draught = 2;
  emit(`${name} the ${CLASSES[pickClass].name} arrives in Emberwatch. Captain Varr has work — check the Quests tab.`, 'quest');
  startOpen = false; $('start').hidden = true; S.parts = []; S.floats = []; FX.length = 0;
  tab = 'hero'; document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x.dataset.tab === tab));
  lastPanel = ''; save(); sceneSize(); render(); window.scrollTo(0, 0);
};
window.addEventListener('resize', () => { if (G) sceneSize(); });

// ===== Loop: real-time accumulator; long gaps (tab asleep) become offline progress =====
let acc = 0, last = Date.now(), sinceUp = 0, sinceSave = 0;
function loop() {
  const now = Date.now(), dt = (now - last) / 1000; last = now;
  if (!G || startOpen) return;
  if (dt > 120) { showReport(offline(dt)); acc = 0; FX.length = 0; }
  else acc += dt * G.speed;
  let n = Math.floor(acc); acc -= n;
  while (n-- > 0) { tick(); if (G.autoUp && ++sinceUp >= 10) { sinceUp = 0; autoUpgrade(); } }
  if ((sinceSave += dt) > 10) { sinceSave = 0; save(); }
  render();
}
function start(hotData) {
  let report = null;
  if (hotData && hotData.p) G = fromSnap(hotData);
  else {
    let d = null; try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) { d = null; }
    if (d && d.p) { G = fromSnap(d); report = offline((Date.now() - d.t) / 1000); FX.length = 0; }
  }
  if (G) { sceneSize(); render(); showReport(report); } else openStart();
  requestAnimationFrame(frame);
  setInterval(loop, 250);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
}
window.claude?.hot?.snapshot?.(() => snapshot());
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
