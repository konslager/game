/* Layout: one-column phone game screen — vitals, arena, tabbed panel, fixed action dock. Single dark look by choice. */
:root {
  --bg: #12141f;
  --surface: #1b1e2d;
  --raised: #252a3d;
  --line: #33395a;
  --fg: #e7e3d6;
  --muted: #9a98a8;
  --brass: #d6a94a;
  --hp: #c8484f;
  --mp: #4a7fd6;
  --xp: #8fb35a;
  --t0: #a8a8b0; --t1: #6cc06a; --t2: #4f9bf0; --t3: #b67cf0; --t4: #f0b84a;
  --display: "Alegreya SC", Georgia, serif;
  --body: "Alegreya Sans", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font: 16px/1.4 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 120px;
  max-width: 560px; margin: 0 auto;
  -webkit-tap-highlight-color: transparent;
}
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .82em; }
h1 { font: 700 1.35rem/1.1 var(--display); margin: 0; letter-spacing: .02em; color: var(--brass); }
h2 { font: 700 1.05rem/1.2 var(--display); margin: 6px 0 0; color: var(--brass); letter-spacing: .02em; }
p.lead { margin: 0; color: var(--muted); font-size: .9rem; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.top .sub { color: var(--muted); font-size: .9rem; }
.gold { color: var(--brass); font-weight: 700; white-space: nowrap; text-align: right; }
.gold small { display: block; color: var(--muted); font-weight: 500; font-size: .75rem; }
.bars { display: grid; gap: 6px; margin-top: 12px; }
.bar { position: relative; height: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; width: 0; transition: width .2s linear; }
.bar > span { position: relative; display: flex; justify-content: space-between; padding: 0 6px; font-size: .75rem; line-height: 16px; }
.bar.hp > i { background: var(--hp); } .bar.mp > i { background: var(--mp); } .bar.xp > i { background: var(--xp); }
.arena { overflow: hidden; margin-top: 14px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.arena.boss { border-color: var(--hp); box-shadow: inset 0 0 0 1px var(--hp); }
.foe { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.foe b { font: 700 1.05rem var(--display); }
.badge { font: 700 .7rem var(--body); letter-spacing: .08em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; background: var(--hp); color: var(--bg); }
.badge.elite { background: var(--t3); }
.hit { height: 1.6em; margin-top: 8px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hit.crit { color: var(--brass); animation: pop .25s ease-out; transform-origin: left center; }
@keyframes pop { from { transform: scale(1.2); } to { transform: none; } }
.gate { margin-top: 10px; display: grid; grid-template-columns: repeat(25, 1fr); gap: 2px; }
.gate i { height: 5px; background: var(--raised); border-radius: 1px; }
.gate i.on { background: var(--brass); }
.gatelabel { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: .8rem; color: var(--muted); }
.activity { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.tabs { display: grid; grid-template-columns: repeat(6, 1fr); margin-top: 14px; border-bottom: 1px solid var(--line); }
.tabs button { position: relative; background: none; border: 0; color: var(--muted); font: 500 .86rem var(--body); padding: 10px 0; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--brass); }
.tabs button.dot::after { content: ""; position: absolute; top: 7px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--brass); }
#panel { margin-top: 10px; display: grid; gap: 8px; }
.attrs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; text-align: center; }
.attrs div, .derived div { background: var(--surface); padding: 6px 2px; border-radius: 4px; }
.attrs small, .derived small { display: block; color: var(--muted); font-size: .7rem; letter-spacing: .08em; }
.derived { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 10px; background: var(--surface); border-radius: 4px; border-left: 3px solid var(--tc, var(--line)); }
.row .name { font-weight: 700; color: var(--tc, var(--fg)); }
.row .meta { color: var(--muted); font-size: .8rem; }
.row .meta.need { color: var(--fg); }
.row .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.miss { color: var(--hp); }
.t0 { --tc: var(--t0); } .t1 { --tc: var(--t1); } .t2 { --tc: var(--t2); } .t3 { --tc: var(--t3); } .t4 { --tc: var(--t4); }
button.sm { font: 700 .78rem var(--body); padding: 7px 9px; border-radius: 4px; border: 1px solid var(--line); background: var(--raised); color: var(--fg); min-width: 64px; }
button.sm.go { background: var(--brass); color: var(--bg); border-color: var(--brass); }
button.sm:disabled { opacity: .4; }
button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.cd { height: 4px; background: var(--raised); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.cd i { display: block; height: 100%; background: var(--mp); }
.cd.q i { background: var(--brass); }
.log { font-size: .88rem; display: grid; gap: 4px; }
.log div { padding: 6px 8px; background: var(--surface); border-radius: 3px; }
.log .up { color: var(--xp); } .log .bad { color: var(--hp); } .log .boss, .log .quest { color: var(--brass); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 500 .8rem var(--body); padding: 6px 11px; border-radius: 99px; border: 1px solid var(--line); background: none; color: var(--muted); }
.chip[aria-pressed="true"] { color: var(--brass); border-color: var(--brass); }
.toggles .chip::before { content: "○ "; } .toggles .chip[aria-pressed="true"]::before { content: "● "; }
.npc { padding: 10px; background: var(--surface); border-radius: 4px; }
.npc b { font-family: var(--display); }
.npc .meta { color: var(--muted); font-size: .8rem; }
.npc p { margin: 4px 0 0; font-size: .9rem; }
.mats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px; }
.mats div { display: flex; justify-content: space-between; gap: 6px; padding: 6px 8px; background: var(--surface); border-radius: 4px; font-size: .85rem; border-left: 3px solid var(--tc, var(--line)); }
.obj { font-size: .85rem; display: grid; gap: 2px; margin-top: 4px; }
.obj .ok { color: var(--xp); }
.section { margin-top: 4px; font: 700 .72rem var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.dock .in { max-width: 528px; margin: 0 auto; display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
.dock button { font: 700 .95rem var(--body); padding: 12px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised); color: var(--fg); }
.dock .primary { background: var(--brass); color: var(--bg); border-color: var(--brass); }
.dock .primary:disabled { background: var(--raised); color: var(--muted); border-color: var(--line); }
.toggles { max-width: 528px; margin: 8px auto 0; display: flex; gap: 5px; align-items: center; overflow-x: auto; scrollbar-width: none; }
.toggles > span { color: var(--muted); font-size: .75rem; flex: none; }
.toggles .chip { flex: none; font-size: .74rem; padding: 4px 8px; }
.notice { margin-top: 12px; padding: 12px; border: 1px solid var(--brass); border-radius: 6px; background: var(--surface); }
.notice p { margin: 0 0 8px; }
.danger { color: var(--hp); }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } .hit.crit { animation: none; } }
</style>

<script>
// ===== Data (mirrors src/IdleMMO.Core) =====
const SLOTS = ['Weapon', 'Armor', 'Helmet', 'Boots', 'Belt', 'Ring'];
const TIERS = ['Common', 'Uncommon', 'Rare', 'Epic', 'Legendary'];
const TIER_IX = Object.fromEntries(TIERS.map((t, i) => [t, i]));
const TIER_MULT = [1, 1.5, 2.2, 3.2, 4.5];
const MAX_ENH = 10, PROMOTE_AT = 5, INV_CAP = 40, LOG_CAP = 40;
const A = (s, a, i, v, l) => ({ s, a, i, v, l });
const addA = (x, y) => { x.s += y.s; x.a += y.a; x.i += y.i; x.v += y.v; x.l += y.l; };
const scaleA = (x, f) => A(Math.round(x.s * f), Math.round(x.a * f), Math.round(x.i * f), Math.round(x.v * f), Math.round(x.l * f));
const totA = x => x.s + x.a + x.i + x.v + x.l;

const CLS = {
  name: 'Gladiator', base: A(50, 20, 5, 30, 10), grow: A(2, 1, 0, 2, 0),
  skills: [
    { id: 'cleave', name: 'Cleave', kind: 'dmg', cd: 3, mp: 5, pow: 1.6, lvl: 1 },
    { id: 'sunder', name: 'Sundering Strike', kind: 'dmg', cd: 5, mp: 10, pow: 2.2, lvl: 3 },
    { id: 'ruin', name: 'Ruin Strike', kind: 'dmg', cd: 8, mp: 20, pow: 3.0, lvl: 5 },
    { id: 'shockwave', name: 'Shockwave', kind: 'dmg', cd: 12, mp: 30, pow: 4.0, lvl: 10 },
    { id: 'second_wind', name: 'Second Wind', kind: 'heal', cd: 15, mp: 15, pow: .35, lvl: 1 },
    { id: 'iron_guard', name: 'Iron Guard', kind: 'shield', cd: 20, mp: 15, pow: .25, lvl: 7 },
  ],
};

const derived = (a, gd) => ({
  pdmg: 10 + a.s * 2, def: Math.trunc(a.v / 5) + gd,
  crit: Math.min(.6, .05 + a.l * .002), critDmg: 1.5 + a.a * .002,
  maxHp: 200 + a.v * 10, maxMp: 50 + a.i * 5,
  hpReg: a.v * .1, mpReg: 1 + a.i * .05, as: 1 + a.a * .005,
});
const mitigate = (raw, def) => Math.max(1, Math.round(raw * 100 / (100 + Math.max(0, def))));

const mult = it => TIER_MULT[it.tier] * (1 + .1 * it.enh);
const effB = it => scaleA(it.base, mult(it));
const effD = it => Math.round(it.def * mult(it));
const power = it => totA(effB(it)) * 2 + effD(it);
const enhCost = it => Math.trunc(40 * it.ilvl * (1 + it.tier) * Math.pow(1.45, it.enh));
const proCostBase = it => 400 * it.ilvl * (1 + it.tier) ** 2;
const salv = it => 5 * it.ilvl * (1 + it.tier) * (1 + it.enh);
const canEnh = it => it.enh < MAX_ENH;
const canPro = it => it.tier < 4 && it.enh >= PROMOTE_AT;

const ZONE_NAMES = ['Ashen Outskirts', 'Shattered Rift', 'Gloomroot Marsh', 'Sunken Bastion', 'Ember Crown Spire', 'Hollow Star Vault'];
const REQ = [1, 6, 12, 19, 27, 36];
const ZONES = ZONE_NAMES.map((name, i) => ({
  id: i + 1, name, req: REQ[i],
  hp: Math.trunc(120 * 2 ** i), dmg: Math.trunc(14 * 1.85 ** i), def: 5 + i * 15,
  exp: Math.trunc(20 * 2.1 ** i), gold: Math.trunc(8 * 2 ** i), kills: 25, loot: .15,
  w: [Math.max(5, 60 - i * 12), 30, 8 + i * 5, 2 + i * 3, i],
}));
const BOSS = { hp: 20, dmg: 3, reward: 15 };
const expToNext = l => Math.round(100 * l ** 2.2);

const BASE_NAMES = {
  Weapon: ['Claymore', 'Greataxe', 'Warblade'], Armor: ['Cuirass', 'Hauberk', 'Plate'],
  Helmet: ['Helm', 'Visor', 'Crown'], Boots: ['Greaves', 'Treads', 'Sabatons'],
  Belt: ['Girdle', 'Cinch', 'Waistguard'], Ring: ['Band', 'Signet', 'Loop'],
};
const PREFIX = ['Worn', 'Tempered', 'Riftforged', 'Stormbound', 'Sunfire'];
const rand = n => Math.floor(Math.random() * n);

// ===== Region (data/regions/emberwatch.json) =====
const R = JSON.parse(document.getElementById('region-data').textContent);
const byId = arr => Object.fromEntries((arr || []).map(x => [x.id, x]));
const MON = byId(R.monsters), MAT = byId(R.materials), NPC = byId(R.npcs), DIST = byId(R.districts), QST = byId(R.quests);
const FACTION = (R.factions || [])[0];
const SHOPS = R.shops || [];
const CONS = {};   // consumables & lootboxes, by id
for (const s of SHOPS) for (const it of s.items) if (it.type === 'consumable' || it.type === 'lootbox') CONS[it.id] = it;
const DROPS = {};  // monsterId -> [{id, chance}]
for (const m of R.materials || []) for (const src of m.sources) if (src.monsterId) (DROPS[src.monsterId] ||= []).push({ id: m.id, chance: src.dropChance });
const NODES = {};  // nodeId -> {mat, seconds}
for (const m of R.materials || []) for (const src of m.sources) if (src.nodeId) NODES[src.nodeId] = { mat: m.id, seconds: src.gatherSeconds };
const NODE_LABEL = { cinder_vein: 'Mine ore', ash_bloom_patch: 'Pick bloom' };
// Zones beyond the region keep feeding the crafting economy.
const GENERIC_DROPS = [{ id: 'riftglass_shard', chance: .12 }, { id: 'cinder_iron_ore', chance: .2 }];
const CRAFT = {};  // service id -> {svc, npc}
for (const c of R.crafters || []) for (const s of c.services) CRAFT[s.id] = { svc: s, npc: NPC[c.npcId] };
const PROMO = {};  // from-tier index -> crafter service
for (const k in CRAFT) { const r = CRAFT[k].svc.requires; if (r && r.fromTier) PROMO[TIER_IX[r.fromTier]] = CRAFT[k]; }
const matName = id => (MAT[id] || CONS[id] || { name: id }).name;
const toItem = d => ({
  id: Math.random().toString(36).slice(2), name: d.name, slot: d.slot, tier: TIER_IX[d.tier], ilvl: d.itemLevel, enh: 0,
  base: A(d.baseBonus.strength, d.baseBonus.agility, d.baseBonus.intelligence, d.baseBonus.vitality, d.baseBonus.luck), def: d.baseDefense || 0,
});
const rankOf = rep => FACTION ? FACTION.ranks.filter(r => rep >= r.minRep).pop() : { rank: '—', shopDiscount: 0 };
const nextRank = rep => FACTION ? FACTION.ranks.find(r => r.minRep > rep) : null;
const rankIx = name => FACTION ? FACTION.ranks.findIndex(r => r.rank === name) : 0;

// Crafting material requirements (formulas from the forge service in the JSON).
function enhMats(it) {
  const m = [{ id: 'cinder_iron_ore', n: 1 + Math.floor(it.enh / 2) }];
  if (it.enh >= 5) m.push({ id: 'riftglass_shard', n: 1 });
  return m;
}
const proMats = it => (PROMO[it.tier] ? PROMO[it.tier].svc.materials.map(x => ({ id: x.id, n: x.qty })) : []);
const hasMats = (p, ms) => ms.every(m => (p.mats[m.id] || 0) >= m.n);
const takeMats = (p, ms) => ms.forEach(m => { p.mats[m.id] -= m.n; });
const addMat = (p, id, n = 1) => { p.mats[id] = (p.mats[id] || 0) + n; };
const proCost = p => it => Math.round(proCostBase(it) * (p.catalyst ? .75 : 1));

// ===== Player =====
function attrs(p) {
  const n = p.level - 1, b = CLS.base, g = CLS.grow;
  const a = A(b.s + g.s * n, b.a + g.a * n, b.i + g.i * n, b.v + g.v * n, b.l + g.l * n);
  for (const it of Object.values(p.eq)) addA(a, effB(it));
  for (const bf of p.buffs) if (bf.kind === 'luck_flat') a.l += bf.value;
  return a;
}
function stats(p) {
  const d = derived(attrs(p), Object.values(p.eq).reduce((t, it) => t + effD(it), 0));
  const defPct = p.buffs.filter(b => b.kind === 'defense_pct').reduce((t, b) => t + b.value, 0);
  d.def = Math.round(d.def * (1 + defPct));
  return d;
}
function restore(p) { const st = stats(p); p.hp = st.maxHp; p.mp = st.maxMp; p.shield = 0; p.cd = {}; p.meter = 0; }
function gainExp(p, n) {
  p.exp += n; let g = 0;
  while (p.exp >= expToNext(p.level)) { p.exp -= expToNext(p.level); p.level++; g++; }
  if (g) restore(p);
  return g;
}
function takeDmg(p, raw) {
  let d = mitigate(raw, stats(p).def);
  const ab = Math.min(p.shield, d); p.shield -= ab; d -= ab;
  p.hp = Math.max(0, p.hp - d);
}
const heal = (p, n) => { p.hp = Math.min(stats(p).maxHp, p.hp + n); };
function ptick(p) {
  const st = stats(p);
  p.rc = (p.rc || 0) + st.hpReg; const w = Math.trunc(p.rc); p.rc -= w; heal(p, w);
  p.mp = Math.min(st.maxMp, p.mp + Math.ceil(st.mpReg));
  for (const k in p.cd) if (p.cd[k] > 0) p.cd[k]--;
  for (const k in p.ccd) if (p.ccd[k] > 0) p.ccd[k]--;
  for (const b of p.buffs) b.left--;
  if (p.buffs.some(b => b.left <= 0)) { p.buffs = p.buffs.filter(b => b.left > 0); const mx = stats(p).maxHp; p.hp = Math.min(p.hp, mx); }
}
const ready = (p, s) => s.lvl <= p.level && p.mp >= s.mp && (p.cd[s.id] || 0) <= 0;
const maxBy = (arr, f) => arr.reduce((m, x) => (m === null || f(x) > f(m) ? x : m), null);
function decide(p) {
  const pct = p.hp / stats(p).maxHp, r = CLS.skills.filter(s => ready(p, s));
  if (pct < .3) { const h = maxBy(r.filter(s => s.kind === 'heal'), s => s.pow); if (h) return h; }
  if (pct < .5 && p.shield === 0) { const s = maxBy(r.filter(s => s.kind === 'shield'), s => s.pow); if (s) return s; }
  return maxBy(r.filter(s => s.kind === 'dmg'), s => s.pow);
}
function equip(p, it) {
  const ix = p.inv.indexOf(it); if (ix >= 0) p.inv.splice(ix, 1);
  const old = p.eq[it.slot];
  if (old) { if (p.inv.length < INV_CAP) p.inv.push(old); else p.gold += salv(old); }
  const oldMax = stats(p).maxHp; p.eq[it.slot] = it; const nm = stats(p).maxHp;
  p.hp = Math.min(nm, Math.max(1, p.hp + nm - oldMax));
}
function receive(p, it) {
  const cur = p.eq[it.slot];
  if (!cur || power(it) > power(cur)) { equip(p, it); return 'equipped'; }
  if (p.inv.length >= INV_CAP) { p.gold += salv(it); return 'salvaged'; }
  p.inv.push(it); return 'stored';
}
function enhance(p, slot) {
  const it = p.eq[slot]; if (!it || !canEnh(it) || p.gold < enhCost(it) || !hasMats(p, enhMats(it))) return false;
  p.gold -= enhCost(it); takeMats(p, enhMats(it)); it.enh++; return true;
}
function promote(p, slot) {
  const it = p.eq[slot], cost = it && proCost(p)(it);
  if (!it || !canPro(it) || p.gold < cost || !hasMats(p, proMats(it))) return false;
  p.gold -= cost; takeMats(p, proMats(it)); it.tier++; it.enh = 0;
  if (p.catalyst) { p.catalyst = false; emit('Rift Catalyst consumed: promote was 25% cheaper.'); }
  emit(`${PROMO[it.tier - 1] ? PROMO[it.tier - 1].npc.name : 'Smith'} promoted ${it.name} to ${TIERS[it.tier]}.`, 'loot t' + it.tier);
  return true;
}

// ===== Consumables =====
function useCons(p, id, silent) {
  const d = CONS[id]; if (!d || !(p.cons[id] > 0)) return false;
  const e = d.effect, st = stats(p);
  if ((p.ccd[id] || 0) > 0) return false;
  if (e.kind === 'heal_pct') heal(p, Math.round(st.maxHp * e.value));
  else if (e.kind === 'mana_flat') p.mp = Math.min(st.maxMp, p.mp + e.value);
  else if (e.kind === 'defense_pct' || e.kind === 'luck_flat') { p.buffs = p.buffs.filter(b => b.id !== id); p.buffs.push({ id, kind: e.kind, value: e.value, left: e.durationSeconds }); }
  else if (e.kind === 'promote_gold_cost_pct') { if (p.catalyst) return false; p.catalyst = true; }
  else if (e.kind === 'roll_item') {
    const z = ZONES[e.zoneId - 1], it = genItem(z, false);
    it.tier = Math.max(it.tier, TIER_IX[e.minTier] || 0);
    emit(`Rift Cache: ${TIERS[it.tier]} ${it.name} — ${receive(p, it)}`, 'loot t' + it.tier);
  }
  if (d.cooldownSeconds) p.ccd[id] = d.cooldownSeconds;
  p.cons[id]--;
  if (!silent && e.kind !== 'roll_item') emit(`Used ${d.name}.`);
  return true;
}
function autoPotions(p) {
  if (!G.autoPot) return;
  const st = stats(p);
  if (p.hp / st.maxHp < .3) useCons(p, 'minor_healing_draught', true);
  if (p.mp / st.maxMp < .2) useCons(p, 'mana_tonic', true);
}

// ===== Loot =====
function rollTier(z) {
  let r = rand(z.w.reduce((a, b) => a + b, 0));
  for (let t = 0; t < 5; t++) { if (r < z.w[t]) return t; r -= z.w[t]; }
  return 0;
}
function genItem(z, boss) {
  const slot = SLOTS[rand(6)]; let tier = rollTier(z); if (boss && tier < 2) tier = 2;
  const ilvl = z.req + rand(4), b = 4 + ilvl * 2, q = d => Math.trunc(b / d);
  const base = {
    Weapon: A(b, q(4), 0, 0, q(6)), Armor: A(q(4), 0, 0, b, 0), Helmet: A(0, 0, q(4), q(2), q(6)),
    Boots: A(0, q(2), 0, q(3), 0), Belt: A(q(3), 0, 0, q(2), 0), Ring: A(q(4), q(4), q(4), 0, q(2)),
  }[slot];
  const def = ['Armor', 'Helmet', 'Boots'].includes(slot) ? ilvl * 2 : 0;
  const nm = BASE_NAMES[slot];
  return { id: Math.random().toString(36).slice(2), name: `${PREFIX[tier]} ${nm[rand(nm.length)]}`, slot, tier, ilvl, enh: 0, base, def };
}

// ===== Session =====
let G;
function newGame() {
  const p = {
    level: 1, exp: 0, gold: 0, hp: 0, mp: 0, shield: 0, hz: 1, inv: [], eq: {}, cd: {}, meter: 0, rc: 0,
    mats: {}, cons: {}, ccd: {}, buffs: [], q: {}, qitems: {}, rep: 0, unlocks: [], daily: { day: '', bought: {} }, catalyst: false, killsBy: {},
  };
  restore(p);
  return {
    p, zone: 1, kills: 0, autoBoss: true, autoUp: true, autoAdv: true, autoPot: true, speed: 1, mode: 'farm', mon: null,
    ticks: 0, log: [], hit: null, loot: true, activity: 'fight', gather: 0, queue: [], district: 'gatehold_square',
  };
}
const Z = () => ZONES[G.zone - 1];
const bossAvail = () => G.kills >= Z().kills && G.mode === 'farm';
function emit(msg, cls = '') { G.log.push({ msg, cls }); if (G.log.length > LOG_CAP) G.log.shift(); }
const regionFoes = id => (R.monsters || []).filter(m => m.zoneId === id && !m.boss && !m.elite);

function fromDef(d, boss) {

}
function spawn() {

  const z = Z(), v = .9 + Math.random() * .2;
  return { mid: null, name: `${z.name} Prowler`, max: Math.trunc(z.hp * v), hp: Math.trunc(z.hp * v), dmg: z.dmg, def: z.def, exp: z.exp, gold: z.gold, boss: false };
}
function startBoss() {

  const z = Z(), rb = regionBoss(z.id); G.mode = 'boss'; G.activity = 'fight'; restore(G.p);
  G.mon = rb ? fromDef(rb, true) : { mid: null, name: `${z.name} Warden`, max: z.hp * BOSS.hp, hp: z.hp * BOSS.hp, dmg: z.dmg * BOSS.dmg, def: z.def * 2, exp: z.exp * BOSS.reward, gold: z.gold * BOSS.reward, boss: true };

}
function travel(id) {

}
function act(m) {

  if (s && s.kind === 'shield') { p.shield = Math.trunc(st.maxHp * s.pow); G.hit = { text: `${s.name} shield ${p.shield}` }; return; }

}
function dropMats(m) {

  for (const d of list) if (Math.random() < d.chance) {
    addMat(G.p, d.id);
    const t = MAT[d.id] ? TIER_IX[MAT[d.id].tier] : 0;

  }
}
function questKill(mid) {

    QST[qid].objectives.forEach((o, i) => {
      if (o.kind === 'kill' && o.monsterId === mid && st.prog[i] < o.count) {
        st.prog[i]++;

      }

}
function killed(m) {

  dropMats(m);
  if (G.loot && (m.boss || Math.random() < z.loot)) {
    const it = genItem(z, m.boss), out = receive(p, it);
    emit(`${TIERS[it.tier]} ${it.name} (${it.slot}) — ${out}`, 'loot t' + it.tier);
  }

    const next = z.id + 1;
    if (next <= ZONES.length) {

      p.hz = Math.max(p.hz, next);

}
function defeated() {

  if (G.mode === 'boss') { G.mode = 'farm'; G.kills = Math.trunc(Z().kills / 2); }

  restore(G.p); G.mon = null;
}
function questTimers() {

}
function tick() {

    if (++G.gather >= node.seconds) {

      G.hit = { text: `+1 ${matName(node.mat)} (${p.mats[node.mat]})` };
    } else G.hit = { text: `Gathering ${matName(node.mat)} ${G.gather}/${node.seconds}s` };
    G.mon = null;
    return;
  }
  if (!G.mon || G.mon.hp <= 0) {

  }
  const m = G.mon;
  autoPotions(p);
  p.meter += stats(p).as;
  while (p.meter >= 1 && m.hp > 0) { p.meter -= 1; act(m); }

// Materials that active "collect" quests still need are kept out of auto-upgrade's reach.
function questReserve(p) {
  const r = {};

    for (const o of QST[qid].objectives) if (o.kind === 'collect') r[o.itemId] = (r[o.itemId] || 0) + o.count;
  return r;
}
function autoUpgrade() {
  const p = G.p, res = questReserve(p);
  for (const k in res) { res[k] = Math.min(res[k], p.mats[k] || 0); p.mats[k] -= res[k]; }
  try { return autoUpgradeInner(p); } finally { for (const k in res) p.mats[k] += res[k]; }
}
function autoUpgradeInner(p) {
  let n = 0;
  for (const slot of SLOTS) {
    const best = maxBy(p.inv.filter(i => i.slot === slot), power);
    if (best && (!p.eq[slot] || power(best) > power(p.eq[slot]))) { equip(p, best); n++; }
  }
  for (const it of p.inv.filter(i => p.eq[i.slot] && power(i) <= power(p.eq[i.slot]))) {
    p.inv.splice(p.inv.indexOf(it), 1); p.gold += salv(it);
  }
  for (let prog = true; prog;) {
    prog = false;
    const order = Object.values(p.eq).sort((a, b) => (canPro(a) ? proCost(p)(a) : enhCost(a)) - (canPro(b) ? proCost(p)(b) : enhCost(b)));
    for (const it of order) {
      if (canPro(it) && promote(p, it.slot)) { n++; prog = true; break; }
      if ((it.enh < PROMOTE_AT || it.tier === 4) && enhance(p, it.slot)) { n++; prog = true; break; }
    }

}

// ===== Town: shops, crafting, districts =====
const today = () => new Date().toISOString().slice(0, 10);
function dailyBought(p, id) { if (p.daily.day !== today()) p.daily = { day: today(), bought: {} }; return p.daily.bought[id] || 0; }
const price = (p, it) => Math.round(it.price * (1 - rankOf(p.rep).shopDiscount));
function canBuy(p, it) {
  if (p.gold < price(p, it)) return false;
  if (it.requires && rankIx(rankOf(p.rep).rank) < rankIx(it.requires.rank)) return false;
  if (it.dailyLimit && dailyBought(p, it.id) >= it.dailyLimit) return false;
  return true;
}
function buy(p, shopId, idx) {
  const it = SHOPS.find(s => s.id === shopId).items[idx];
  if (!canBuy(p, it)) return;
  p.gold -= price(p, it);
  if (it.dailyLimit) p.daily.bought[it.id] = dailyBought(p, it.id) + 1;
  if (it.type === 'equipment') emit(`Bought ${it.name} — ${receive(p, toItem(it))}`, 'loot t' + TIER_IX[it.tier]);
  else if (it.type === 'material') { addMat(p, it.id); emit(`Bought ${matName(it.id)}.`); }
  else { p.cons[it.id] = (p.cons[it.id] || 0) + 1; emit(`Bought ${it.name}.`); }
}
function craft(p, svcId) {
  const c = CRAFT[svcId], s = c.svc, ms = s.materials.map(x => ({ id: x.id, n: x.qty }));
  if (s.unlockedByQuestId && !p.unlocks.includes(svcId)) return;
  if (p.gold < s.goldCost || !hasMats(p, ms)) return;
  p.gold -= s.goldCost; takeMats(p, ms);

  emit(`${c.npc.name} crafted ${it.name} — ${receive(p, it)}`, 'loot t' + it.tier);
}
function visit(id) {
  G.district = id;
  const d = DIST[id];

    for (let i = 0; i < ev.spawn.count; i++) G.queue.push(ev.spawn.monsterId);
    G.activity = 'fight'; G.mon = null;
    emit(`Ambush in ${d.name}! ${ev.spawn.count}× ${MON[ev.spawn.monsterId].name}`, 'bad');
  }
}

// ===== Quests =====
const qState = qid => G.p.q[qid];
function qAvailable(q) {
  const s = qState(q.id);
  return (!s || s.state === 'failed') && G.p.level >= q.minLevel && q.prerequisiteQuestIds.every(x => qState(x) && qState(x).state === 'done');
}
function objDone(q, st, i) {
  const o = q.objectives[i];
  if (o.kind === 'kill') return st.prog[i] >= o.count;
  if (o.kind === 'collect') return (G.p.mats[o.itemId] || 0) >= o.count;
  return st.prog[i] >= 1;
}
const qComplete = (q, st) => q.objectives.every((o, i) => o.optional || objDone(q, st, i));
function acceptQuest(qid) {
  G.p.q[qid] = { state: 'active', prog: QST[qid].objectives.map(() => 0), t: G.ticks };
  emit(`Quest accepted: ${QST[qid].name}`, 'quest');
}
function failQuest(qid, why) {
  const q = QST[qid]; G.p.q[qid].state = 'failed';
  for (const qi of q.questItems || []) delete G.p.qitems[qi.id];
  emit(`Quest failed: ${q.name} (${why}). Ask ${NPC[q.giverNpcId].name} to try again.`, 'bad');
}
function questAction(qid, i) {
  const q = QST[qid], st = qState(qid), o = q.objectives[i];
  if (o.kind === 'talk') {
    visit(NPC[o.npcId].districtId);
    st.prog[i] = 1;
    if (o.receivesItemId) G.p.qitems[o.receivesItemId] = 1;
    emit(`${NPC[o.npcId].name} hands you the ${(q.questItems || []).find(x => x.id === o.receivesItemId)?.name || 'package'}.`, 'quest');
  } else if (o.kind === 'deliver') {
    const prev = q.objectives.slice(0, i).every((x, j) => x.optional || objDone(q, st, j));
    if (!prev || !G.p.qitems[o.itemId]) return;
    visit(NPC[o.toNpcId].districtId);
    delete G.p.qitems[o.itemId]; st.prog[i] = 1;
    emit(`Delivered to ${NPC[o.toNpcId].name}.`, 'quest');
  }
}
function turnIn(qid) {
  const q = QST[qid], st = qState(qid), p = G.p, r = q.rewards;
  if (!st || st.state !== 'active' || !qComplete(q, st)) return;
  q.objectives.forEach(o => { if (o.kind === 'collect') p.mats[o.itemId] -= o.count; });
  st.state = 'done';
  gainExp(p, r.exp); p.gold += r.gold;
  for (const rp of r.reputation || []) p.rep += rp.amount;
  for (const it of r.items || []) {
    if (it.type === 'equipment') emit(`Reward: ${it.name} — ${receive(p, toItem(it))}`, 'loot t' + TIER_IX[it.tier]);
    else p.cons[it.id] = (p.cons[it.id] || 0) + it.qty;
  }
  for (const u of r.unlocks || []) if (!p.unlocks.includes(u)) p.unlocks.push(u);
  const opt = q.objectives.some((o, i) => o.optional && objDone(q, st, i));
  if (opt && r.bonusIfOptionalDone) p.gold += r.bonusIfOptionalDone.gold;
  emit(`Quest complete: ${q.name} — +${r.exp} exp, +${r.gold + (opt && r.bonusIfOptionalDone ? r.bonusIfOptionalDone.gold : 0)} gold`, 'quest');
}

// ===== Offline progress (sample 300 ticks, extrapolate at 60%, cap 12h) =====
const totalExp = p => { let s = p.exp; for (let l = 1; l < p.level; l++) s += expToNext(l); return s; };
function offline(seconds) {
  const sec = Math.min(Math.floor(seconds), 12 * 3600);
  if (sec <= 0) return null;
  const p = G.p, e0 = totalExp(p), g0 = p.gold, l0 = p.level, sample = Math.min(sec, 300);
  const ab = G.autoBoss, act0 = G.activity; G.autoBoss = false; G.loot = false; G.activity = 'fight'; G.queue = [];
  for (let i = 0; i < sample; i++) tick();
  G.autoBoss = ab; G.loot = true; G.activity = act0;
  const rest = sec - sample;
  if (rest > 0) {
    const k = rest / sample * .6;
    gainExp(p, Math.trunc((totalExp(p) - e0) * k)); p.gold += Math.trunc((p.gold - g0) * k);
  }
  restore(p);
  return { sec, exp: totalExp(p) - e0, gold: p.gold - g0, lv: p.level - l0 };
}

  autoAdv: G.autoAdv, autoPot: G.autoPot, speed: G.speed, activity: G.activity, district: G.district, ticks: G.ticks,

function fromSnap(d) {

      <div class="acts">${btn('Equip', `data-act="equip" data-id="${it.id}"`)}${btn(`Sell ${fmt(salv(it))}`, `data-act="sell" data-id="${it.id}"`)}</div></div>`).join('');
  if (p.inv.length > 12) h += `<div class="meta">${p.inv.length - 12} weaker items not shown.</div>`;
  if (p.inv.length) h += `<div class="acts" style="display:flex;justify-content:flex-end">${btn(`Salvage all (${fmt(p.inv.reduce((t, i) => t + salv(i), 0))} g)`, 'data-act="salvage"')}</div>`;
  return h;
}

function effectText(d) {
  const e = d.effect;
  return { heal_pct: `Restores ${e.value * 100}% HP`, mana_flat: `Restores ${e.value} MP`, defense_pct: `+${e.value * 100}% DEF for ${e.durationSeconds / 60} min`,
    luck_flat: `+${e.value} LUK for ${e.durationSeconds / 60} min`, promote_gold_cost_pct: `Next promote costs ${-e.value * 100}% less gold`,
    roll_item: `Random item from zone ${e.zoneId}, ${e.minTier} or better` }[e.kind] + (d.cooldownSeconds ? ` · ${d.cooldownSeconds}s cooldown` : '');
}
function itemLine(it) {
  if (it.type === 'equipment') {
    const b = it.baseBonus, parts = [['STR', b.strength], ['AGI', b.agility], ['INT', b.intelligence], ['VIT', b.vitality], ['LUK', b.luck], ['DEF', it.baseDefense]].filter(x => x[1]).map(x => `${x[0]} ${x[1]}`);
    return `${it.slot} · ${it.tier} · iLvl ${it.itemLevel} · ${parts.join(', ')}`;
  }
  if (it.type === 'material') return `${MAT[it.id].tier} material`;
  return effectText(it);
}

function townHtml(p) {
  const d = DIST[G.district];
  let h = `<div class="chips">${R.districts.map(x => `<button class="chip" data-act="district" data-id="${x.id}" aria-pressed="${x.id === G.district}">${esc(x.name)}</button>`).join('')}</div>`;
  h += `<h2>${esc(d.name)}</h2><p class="lead">${esc(d.description)}${d.safeZone ? '' : ' <span class="miss">Unsafe district.</span>'}</p>`;
  for (const nid of d.npcIds || []) {
    const n = NPC[nid];
    h += `<div class="npc"><b>${esc(n.name)}</b> <span class="meta">${esc(n.race)} · ${esc(n.profession || n.role.replace('_', ' '))}</span><p>${esc(n.trait)}</p></div>`;
    for (const s of SHOPS.filter(s => s.ownerNpcId === nid)) {
      h += `<div class="section">${esc(s.name)} — ${esc(s.specialization)}</div>`;
      h += s.items.map((it, i) => {
        const name = it.name || matName(it.id), t = it.tier ? TIER_IX[it.tier] : (it.type === 'material' ? TIER_IX[MAT[it.id].tier] : '');
        const lock = it.requires && rankIx(rankOf(p.rep).rank) < rankIx(it.requires.rank) ? `Requires ${it.requires.rank}` : '';
        const lim = it.dailyLimit ? ` · ${it.dailyLimit - dailyBought(p, it.id)}/${it.dailyLimit} left today` : '';
        const owned = it.type === 'material' ? ` · have ${p.mats[it.id] || 0}` : CONS[it.id] ? ` · have ${p.cons[it.id] || 0}` : '';
        return `<div class="row ${t !== '' ? 't' + t : ''}"><div><div class="name">${esc(name)}</div><div class="meta">${esc(itemLine(it))}${lim}${owned}</div>${lock ? `<div class="meta miss">${lock}</div>` : ''}</div>
          <div class="acts">${btn(`Buy<br><span class="num">${fmt(price(p, it))} g</span>`, `data-act="buy" data-shop="${s.id}" data-i="${i}"`, canBuy(p, it))}</div></div>`;
      }).join('');
    }
    const cr = (R.crafters || []).find(c => c.npcId === nid);
    if (cr) {
      h += `<div class="section">${esc(n.profession)} services</div>`;
      for (const s of cr.services) {
        if (s.output) {
          const ms = s.materials.map(x => ({ id: x.id, n: x.qty })), locked = s.unlockedByQuestId && !p.unlocks.includes(s.id);
          h += `<div class="row t${TIER_IX[s.output.tier]}"><div><div class="name">${esc(s.output.name)}</div><div class="meta">${esc(itemLine(s.output))}</div>
            <div class="meta need">${matsText(p, ms)}</div>${locked ? `<div class="meta miss">Unlocked by quest “${esc(QST[s.unlockedByQuestId].name)}”</div>` : ''}</div>
            <div class="acts">${btn(`Craft<br><span class="num">${fmt(s.goldCost)} g</span>`, `data-act="craft" data-id="${s.id}"`, !locked && p.gold >= s.goldCost && hasMats(p, ms))}</div></div>`;
        } else {
          const ms = s.id === 'enhance' ? 'Cinder Iron Ore ×(1 + enh/2); from +5 also 1 Riftglass Shard' : s.materials.map(x => `${x.qty}× ${matName(x.id)}`).join(', ');
          h += `<div class="row"><div><div class="name">${esc(s.name)}</div><div class="meta">${esc(ms)} · use the Gear tab</div></div></div>`;
        }
      }
    }
  }
  if (d.features && d.features.includes('reputation_vendor')) {
    const rk = rankOf(p.rep);
    h += `<div class="section">Quartermaster</div>` + FACTION.ranks.map(r => `<div class="row ${r.rank === rk.rank ? 't4' : ''}"><div><div class="name">${r.rank}</div><div class="meta">${r.minRep} rep · ${Math.round(r.shopDiscount * 100)}% shop discount</div></div></div>`).join('');
  }
  if (d.features && d.features.includes('boss_gate')) {
    const rb = regionBoss(G.zone);
    h += `<div class="row t3"><div><div class="name">Boss gate</div><div class="meta">${rb ? esc(rb.name) : esc(Z().name) + ' Warden'} · ${Math.min(G.kills, Z().kills)}/${Z().kills} kills</div></div></div>`;
  }
  if (d.leadsToZoneId) {
    const open = p.hz >= d.leadsToZoneId;
    h += `<div class="row ${open ? 't1' : ''}"><div><div class="name">${open ? 'Gate open' : 'Sealed'}</div><div class="meta">${open ? 'Travel from the Zones tab.' : `Defeat ${esc(MON[d.unlock.monsterId].name)} to open it.`}</div></div>
      <div class="acts">${open && G.zone !== d.leadsToZoneId ? btn('Travel', `data-act="go" data-zone="${d.leadsToZoneId}"`, p.level >= ZONES[d.leadsToZoneId - 1].req) : ''}</div></div>`;
  }
  return h;
}

function questsHtml(p) {
  const all = Object.values(QST);
  const list = all.filter(q => qState(q.id) && qState(q.id).state === 'active')
    .concat(all.filter(q => qAvailable(q)))
    .concat(all.filter(q => !qState(q.id) && !qAvailable(q)))
    .concat(all.filter(q => qState(q.id) && qState(q.id).state === 'done'));
  return list.map(q => {
    const st = qState(q.id), r = q.rewards, g = NPC[q.giverNpcId];
    const rew = [`${fmt(r.exp)} exp`, `${fmt(r.gold)} g`, ...(r.reputation || []).map(x => `${x.amount} rep`), ...(r.items || []).map(i => `${i.qty > 1 ? i.qty + '× ' : ''}${i.name || matName(i.id)}`)].join(' · ');
    let body = `<div class="meta">${q.type} · Lv ${q.minLevel}+ · from ${esc(g.name)} (${esc(DIST[g.districtId].name)})</div>`;
    let actBtn = '';
    if (st && st.state === 'active') {
      body += `<div class="obj">${q.objectives.map((o, i) => {
        const done = objDone(q, st, i);
        let label, extra = '';
        if (o.kind === 'kill') label = `Kill ${MON[o.monsterId].name} ${Math.min(st.prog[i], o.count)}/${o.count}`;
        else if (o.kind === 'collect') label = `Bring ${matName(o.itemId)} ${Math.min(p.mats[o.itemId] || 0, o.count)}/${o.count}`;
        else if (o.kind === 'talk') { label = `Meet ${NPC[o.npcId].name} in ${DIST[NPC[o.npcId].districtId].name}`; if (!done) extra = btn('Go', `data-act="qact" data-q="${q.id}" data-i="${i}"`); }
        else { label = `Deliver to ${NPC[o.toNpcId].name} in ${DIST[NPC[o.toNpcId].districtId].name}`; if (!done) extra = btn('Deliver', `data-act="qact" data-q="${q.id}" data-i="${i}"`, !!p.qitems[o.itemId]); }
        return `<div class="${done ? 'ok' : ''}">${done ? '✓' : '○'} ${esc(label)}${o.optional ? ' (optional)' : ''} ${extra}</div>`;
      }).join('')}</div>`;
      if (q.timeLimitSeconds) {
        const left = q.timeLimitSeconds - (G.ticks - st.t);
        body += `<div class="meta">Time left: <span class="num">${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</span> (game time)</div><div class="cd q"><i style="width:${left / q.timeLimitSeconds * 100}%"></i></div>`;
      }
      actBtn = btn('Turn in', `data-act="turnin" data-q="${q.id}"`, qComplete(q, st), 'sm go');
    } else if (qAvailable(q)) {
      body += `<p class="lead" style="margin-top:4px">${esc(q.description)}</p>`;
      if (st && st.state === 'failed') body += `<div class="meta miss">Failed earlier — you can try again.</div>`;
      actBtn = btn('Accept', `data-act="accept" data-q="${q.id}"`, true, 'sm go');
    } else if (st && st.state === 'done') {
      actBtn = '<span class="meta">Done</span>';
    } else {
      const need = [p.level < q.minLevel ? `Lv ${q.minLevel}` : '', ...q.prerequisiteQuestIds.filter(x => !(qState(x) && qState(x).state === 'done')).map(x => `“${QST[x].name}”`)].filter(Boolean).join(', ');
      body += `<div class="meta miss">Requires ${esc(need)}</div>`;
      actBtn = '<span class="meta">Locked</span>';
    }
    body += `<div class="meta">Reward: ${esc(rew)}${r.bonusIfOptionalDone ? ` · +${r.bonusIfOptionalDone.gold} g bonus` : ''}</div>`;
    return `<div class="row ${st && st.state === 'done' ? '' : 't4'}"><div><div class="name">${esc(q.name)}</div>${body}</div><div class="acts">${actBtn}</div></div>`;
  }).join('');
}

function zonesHtml(p) {
  return ZONES.map(z => {
    const open = z.id <= p.hz, lvlOk = p.level >= z.req, here = z.id === G.zone, rb = regionBoss(z.id), foes = regionFoes(z.id);
    return `<div class="row"><div><div class="name">${z.id}. ${z.name}</div>
      <div class="meta">Lv ${z.req}+ · ${foes.length ? esc(foes.map(f => f.name).join(', ')) : `foe HP ${fmt(z.hp)}`}</div>
      <div class="meta">Boss: ${rb ? esc(rb.name) : esc(z.name) + ' Warden'}</div></div>
      <div class="acts">${here ? '<span class="meta">Here</span>' : btn(!open ? 'Locked' : !lvlOk ? 'Lv ' + z.req : 'Travel', `data-act="go" data-zone="${z.id}"`, open && lvlOk)}</div></div>`;
  }).join('') + `<div class="row"><div><div class="name">New game</div><div class="meta">Erases this hero.</div></div><div class="acts" id="resetBox">${resetPending ? btn('Erase', 'data-act="reset-yes"', true, 'sm danger') + btn('Keep', 'data-act="reset-no"') : btn('Reset', 'data-act="reset"')}</div></div>`;
}

function panelHtml() {
  const p = G.p;
  if (tab === 'hero') return heroHtml(p);
  if (tab === 'gear') return gearHtml(p);
  if (tab === 'town') return townHtml(p);
  if (tab === 'quests') return questsHtml(p);
  if (tab === 'zones') return zonesHtml(p);
  return `<div class="log">${G.log.slice().reverse().map(l => `<div class="${l.cls}">${esc(l.msg)}</div>`).join('') || '<div>Fights will appear here.</div>'}</div>`;
}

function render() {
  const p = G.p, st = stats(p), z = Z(), m = G.mon;
  $('hZone').textContent = `Zone ${z.id}: ${z.name}`;
  $('hGold').textContent = fmt(p.gold);
  $('hRep').textContent = `${rankOf(p.rep).rank} · ${p.rep} rep`;
  setBar('bHp', p.hp, st.maxHp); $('tHp').textContent = `${p.hp}/${st.maxHp}${p.shield ? ' +' + p.shield : ''}`;
  setBar('bMp', p.mp, st.maxMp); $('tMp').textContent = `${p.mp}/${st.maxMp}`;
  setBar('bXp', p.exp, expToNext(p.level)); $('tLv').textContent = `Lv ${p.level}`; $('tXp').textContent = `${fmt(p.exp)}/${fmt(expToNext(p.level))}`;
  const gathering = G.activity !== 'fight' && !G.queue.length && G.mode !== 'boss';
  $('mName').textContent = gathering ? (G.activity === 'cinder_vein' ? 'Cinder Vein' : 'Ash Bloom patch') : m ? m.name : 'Searching…';
  $('mBadge').innerHTML = m && m.boss ? '<span class="badge">Boss</span>' : m && m.elite ? '<span class="badge elite">Elite</span>' : '';
  $('arena').classList.toggle('boss', !!(m && m.boss));
  if (gathering) { const n = NODES[G.activity]; setBar('bMon', G.gather, n.seconds); $('tMon').textContent = `${G.gather}/${n.seconds}s`; }
  else if (m) { setBar('bMon', m.hp, m.max); $('tMon').textContent = `${fmt(m.hp)}/${fmt(m.max)}`; }
  const hit = $('hit');
  if (G.hit) { hit.textContent = G.hit.text; hit.className = 'hit' + (G.hit.crit ? ' crit' : ''); }
  const k = Math.min(G.kills, z.kills);
  $('gate').innerHTML = Array.from({ length: z.kills }, (_, i) => `<i class="${i < k ? 'on' : ''}"></i>`).join('');
  $('gateText').textContent = G.mode === 'boss' ? 'Boss fight in progress' : bossAvail() ? (p.level < z.req ? `Boss needs Lv ${z.req}` : 'Boss ready') : `Boss gate ${k}/${z.kills} kills`;
  $('modeText').textContent = G.queue.length ? `${G.queue.length} ambushers left` : '';
  const acts = [['fight', 'Fight'], ...Object.keys(NODES).map(id => [id, NODE_LABEL[id] || id])];
  const ah = acts.map(([id, l]) => `<button class="chip" data-activity="${id}" aria-pressed="${G.activity === id}">${l}</button>`).join('');
  if ($('activity').dataset.h !== ah) { $('activity').innerHTML = ah; $('activity').dataset.h = ah; }
  $('btnBoss').disabled = !(bossAvail() && p.level >= z.req);
  $('btnSpeed').textContent = `Speed ${G.speed}×`;
  $('tgBoss').setAttribute('aria-pressed', G.autoBoss); $('tgUp').setAttribute('aria-pressed', G.autoUp);
  $('tgAdv').setAttribute('aria-pressed', G.autoAdv); $('tgPot').setAttribute('aria-pressed', G.autoPot);
  const qReady = Object.entries(p.q).some(([id, s]) => s.state === 'active' && qComplete(QST[id], s)) || Object.values(QST).some(q => qAvailable(q));
  document.querySelector('[data-tab="quests"]').classList.toggle('dot', qReady && tab !== 'quests');
  const html = panelHtml();
  if (html !== lastPanel) { $('panel').innerHTML = html; lastPanel = html; }
}

$('panel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const p = G.p, a = b.dataset.act, ds = b.dataset;
  if (a === 'enh') enhance(p, ds.slot);
  else if (a === 'pro') promote(p, ds.slot);
  else if (a === 'salvage') { p.gold += p.inv.reduce((t, i) => t + salv(i), 0); p.inv = []; }
  else if (a === 'equip') { const it = p.inv.find(i => i.id === ds.id); if (it) equip(p, it); }
  else if (a === 'sell') { const it = p.inv.find(i => i.id === ds.id); if (it) { p.inv.splice(p.inv.indexOf(it), 1); p.gold += salv(it); } }
  else if (a === 'use') useCons(p, ds.id);
  else if (a === 'open') failQuest(ds.q, 'you opened the sealed package');
  else if (a === 'buy') buy(p, ds.shop, +ds.i);
  else if (a === 'craft') craft(p, ds.id);
  else if (a === 'district') visit(ds.id);
  else if (a === 'accept') acceptQuest(ds.q);
  else if (a === 'qact') questAction(ds.q, +ds.i);
  else if (a === 'turnin') turnIn(ds.q);
  else if (a === 'go') travel(+ds.zone);
  else if (a === 'reset') resetPending = true;
  else if (a === 'reset-no') resetPending = false;
  else if (a === 'reset-yes') { resetPending = false; G = newGame(); emit('A Gladiator arrives in Emberwatch.'); }
  lastPanel = ''; render(); save();
});
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.tab; resetPending = false;
  document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  lastPanel = ''; render();
});
$('activity').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  G.activity = b.dataset.activity; G.gather = 0; G.mon = null; render();
});
$('btnBoss').onclick = () => { G.activity = 'fight'; startBoss(); render(); };
$('btnUp').onclick = () => { const n = autoUpgrade(); emit(n ? `Upgrade: ${n} improvements` : 'Upgrade: nothing affordable (check gold and materials)'); lastPanel = ''; render(); save(); };
$('btnSpeed').onclick = () => { G.speed = G.speed === 1 ? 5 : G.speed === 5 ? 20 : 1; render(); };
$('tgBoss').onclick = () => { G.autoBoss = !G.autoBoss; render(); };
$('tgUp').onclick = () => { G.autoUp = !G.autoUp; render(); };
$('tgAdv').onclick = () => { G.autoAdv = !G.autoAdv; render(); };
$('tgPot').onclick = () => { G.autoPot = !G.autoPot; render(); };

function showReport(r) {
  if (!r || r.sec < 60) return;
  const h = Math.floor(r.sec / 3600), mnt = Math.floor(r.sec % 3600 / 60);
  $('notice').innerHTML = `<div class="notice"><p><b>Welcome back.</b> Away ${h}h ${mnt}m: +${fmt(r.exp)} exp, +${fmt(r.gold)} gold${r.lv ? `, +${r.lv} levels` : ''}.</p><button class="sm" id="dismiss">Continue</button></div>`;
  $('dismiss').onclick = () => { $('notice').innerHTML = ''; };
}

// ===== Loop: real-time accumulator; long gaps (tab asleep) become offline progress =====
let acc = 0, last = Date.now(), sinceUp = 0, sinceSave = 0;
function loop() {
  const now = Date.now(), dt = (now - last) / 1000; last = now;
  if (dt > 120) { showReport(offline(dt)); acc = 0; }
  else acc += dt * G.speed;
  let n = Math.floor(acc); acc -= n;
  while (n-- > 0) { tick(); if (G.autoUp && ++sinceUp >= 10) { sinceUp = 0; autoUpgrade(); } }
  if ((sinceSave += dt) > 10) { sinceSave = 0; save(); }
  render();
}
function start(hotData) {
  let report = null;
  if (hotData && hotData.p) G = fromSnap(hotData);
  else {
    let d = null; try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) { d = null; }
    if (d && d.p) { G = fromSnap(d); report = offline((Date.now() - d.t) / 1000); }
    else {
      G = newGame();
      G.p.cons.minor_healing_draught = 2;
      emit('A Gladiator arrives in Emberwatch. Captain Varr has work — check the Quests tab.', 'quest');
    }
  }
  render(); showReport(report);
  setInterval(loop, 250);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
}
window.claude?.hot?.snapshot?.(() => snapshot());
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
